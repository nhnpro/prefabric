id = "xml"
name = "XML"
extensions = ["xml", "xsd", "xsl", "xslt", "svg", "plist", "csproj", "fsproj", "vbproj", "props", "targets", "nuspec", "xaml", "axaml", "resx", "wsdl", "fxml", "iml", "jnlp", "rss", "atom", "xliff", "xlf", "storyboard", "xib", "tld", "pom", "uxml"]
filenames = ["NuGet.Config", "Directory.Build.targets", "web.config", "app.config"]
first-line = "^<\\?xml\\b"
block-comment = ["<!--", "-->"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "XML"
tree-sitter = "xml"

[[language-servers]]
name = "lemminx"
command = "lemminx"
install-hint = "Install Eclipse LemMinX (https://github.com/redhat-developer/vscode-xml/releases, binary `lemminx`)"

# Unity UXML: the schema Unity generates in `UIElementsSchema/` (Prefabric's "Generate Project
# Files" updates it). UI Builder writes `noNamespaceSchemaLocation` without the `xsi:` prefix, so
# the schema is associated by file pattern; lemminx resolves the path against the workspace root.
[language-servers.settings.xml]
fileAssociations = [{ pattern = "**/*.uxml", systemId = "UIElementsSchema/UIElements.xsd" }]
