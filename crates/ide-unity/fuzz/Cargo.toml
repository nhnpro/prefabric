[package]
name = "ide-unity-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ide-unity = { path = ".." }

# Not a member of the main workspace: `cargo +nightly fuzz run scan` from `crates/ide-unity`.
[workspace]
members = ["."]

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false
